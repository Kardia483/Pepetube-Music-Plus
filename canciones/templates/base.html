{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PepeTube Music Plus{% endblock %}</title>
    <style>
        :root {
            --morado: #8e2de2;
            --morado-hover: #a855f7;
            --fondo: #0a0a0c;
            --tarjeta: #17141f;
            --tarjeta-hover: #241f31;
            --texto: #ffffff;
            --texto-tenue: #b7aec7;
            --borde: #322b40;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }
        a { color: var(--morado-hover); }

        /* Header / nav */
        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 40px;
            background: linear-gradient(135deg, #000000 0%, #23103a 100%);
            border-bottom: 2px solid var(--morado);
            flex-wrap: wrap;
        }
        header img.logo {
            height: 48px;
            width: 48px;
            border-radius: 8px;
            object-fit: cover;
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }
        header p {
            margin: 2px 0 0;
            color: var(--texto-tenue);
            font-size: 0.85rem;
        }
        nav.usuario {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        nav.usuario .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--morado);
        }
        nav.usuario .nombre-usuario {
            font-size: 0.9rem;
            color: var(--texto-tenue);
        }

        /* Botones reutilizables */
        .btn-solid {
            padding: 10px 22px;
            border: none;
            border-radius: 24px;
            background: var(--morado);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-solid:hover { background: var(--morado-hover); }
        .btn-outline {
            padding: 9px 20px;
            border: 1px solid var(--morado);
            border-radius: 24px;
            background: none;
            color: var(--morado-hover);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline:hover { background: var(--morado); color: #fff; }

        /* Layout general */
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }
        .card {
            background: var(--tarjeta);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        /* Tarjeta de login / registro */
        .card.auth {
            max-width: 380px;
            margin: 40px auto;
            text-align: center;
        }
        .card.auth form { text-align: left; }
        .card.auth p { margin: 0 0 14px; }
        .card.auth label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: var(--texto-tenue);
        }
        .card.auth input[type="text"],
        .card.auth input[type="password"],
        .card.auth input[type="file"] {
            width: 100%;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background: #221f2b;
            color: var(--texto);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .card.auth .helptext {
            display: block;
            color: var(--texto-tenue);
            font-size: 0.78rem;
            margin-bottom: 10px;
        }
        .card.auth ul.errorlist {
            list-style: none;
            margin: 0 0 8px;
            padding: 0;
            color: #ff6b6b;
            font-size: 0.85rem;
        }
        .card.auth .btn-solid {
            width: 100%;
            margin-top: 8px;
        }
        .card.auth .ayuda {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--texto-tenue);
        }
        .errores {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        /* Formularios y lista de la playlist */
        form.agregar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        form.agregar input[type="text"] {
            flex: 1 1 200px;
            padding: 12px 14px;
            border-radius: 24px;
            border: 1px solid var(--borde);
            background: #221f2b;
            color: var(--texto);
            font-size: 0.95rem;
        }
        form.agregar input[type="text"]::placeholder { color: var(--texto-tenue); }
        form.agregar input[type="text"]:focus {
            outline: none;
            border-color: var(--morado);
        }
        ul.playlist {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        ul.playlist li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
        }
        ul.playlist li:hover { background: var(--tarjeta-hover); }
        ul.playlist li + li { margin-top: 4px; }
        .info-cancion {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }
        .info-cancion .titulo {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info-cancion .artista {
            color: var(--morado-hover);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .duracion {
            color: var(--texto-tenue);
            font-size: 0.85rem;
        }
        .vacio {
            color: var(--texto-tenue);
            text-align: center;
            padding: 20px 0;
        }
        form.borrar button {
            background: none;
            border: none;
            color: var(--texto-tenue);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 6px;
        }
        form.borrar button:hover {
            color: #ff5c5c;
            background: rgba(255, 92, 92, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <img class="logo" src="{% static 'canciones/logo.jpg' %}" alt="Logo de PepeTube Music Plus">
        <div>
            <h1>PepeTube Music Plus</h1>
            <p>Tu playlist, guardada con Django ORM</p>
        </div>
        <nav class="usuario">
            {% if user.is_authenticated %}
                <img class="avatar"
                     src="{% if user.perfil.foto %}{{ user.perfil.foto.url }}{% else %}{% static 'canciones/logo.jpg' %}{% endif %}"
                     alt="Foto de perfil de {{ user.username }}">
                <span class="nombre-usuario">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn-outline">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn-outline">Iniciar sesión</a>
                <a href="{% url 'registro' %}" class="btn-solid">Registrarse</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
